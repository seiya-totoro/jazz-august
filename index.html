<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwingBeans 出席・曲管理</title>
  <meta name="description" content="&#8203;">
  <meta name="robots" content="max-snippet:0">
  <link rel="canonical" href="https://seiya-totoro.github.io/jazz-august/">
  <meta itemprop="name" content="SwingBeans 出席・曲管理">
  <meta itemprop="description" content="&#8203;">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://seiya-totoro.github.io/jazz-august/">
  <meta property="og:site_name" content="SwingBeans 出席・曲管理">
  <meta property="og:title" content="SwingBeans 出席・曲管理">
  <meta property="og:description" content="&#8203;">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SwingBeans 出席・曲管理">
  <meta name="twitter:description" content="&#8203;">
  <link rel="stylesheet" href="./styles.css?v=20260730-participants-left">
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">practice notes</p>
        <h1>SwingBeans</h1>
      </div>
    </header>

    <nav class="main-tabs" aria-label="画面切り替え">
      <button class="tab" data-view="home">ホーム</button>
      <button class="tab is-active" data-view="attendance">出席入力</button>
      <button class="tab" data-view="songs">曲メンバー</button>
      <button class="tab" data-view="thursdays">日程一覧</button>
    </nav>

    <div id="syncWarning" class="sync-warning" hidden>
      共有保存に接続できていません。今はこの端末だけに保存されます。
    </div>

    <main>
      <section id="home" class="view" aria-labelledby="homeTitle">
        <div class="night-board">
          <div>
            <p class="eyebrow">next practice</p>
            <h2 id="homeTitle">一番近い練習日</h2>
            <p class="soft-text" id="homeDateText">読み込み中...</p>
            <div class="home-today-grid">
              <div>
                <h3>この日の曲順</h3>
                <div id="homeSongs" class="home-song-order"></div>
              </div>
              <div>
                <h3>この日に参加できるメンバー</h3>
                <div id="homeTodayMembers" class="member-chips"></div>
              </div>
              <div>
                <h3>レアメンバー</h3>
                <div id="homeRareMembers" class="rare-lines"></div>
              </div>
            </div>
          </div>
          <div class="moon-mark" aria-hidden="true"></div>
        </div>

        <div class="home-grid">
          <section class="paper-panel">
            <h3>未入力の人</h3>
            <div id="homePendingMembers" class="member-lines compact"></div>
          </section>
        </div>
      </section>

      <section id="attendance" class="view is-active" aria-labelledby="attendanceTitle">
        <div class="paper-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">your plan</p>
              <h2 id="attendanceTitle">出席入力</h2>
            </div>
            <span class="save-note" id="attendanceSaveNote"></span>
          </div>
          <label class="field-label" for="memberSelect">自分の名前を選んでください</label>
          <select id="memberSelect" class="select"></select>
          <p id="attendanceLegend" class="legend-text" hidden>◎=参加 / ○=一部参加(0.1) / △=未確定・かなり短時間 / ×=欠席</p>
          <div id="attendanceRows" class="attendance-list"></div>
        </div>
      </section>

      <section id="songs" class="view" aria-labelledby="songsTitle">
        <div class="paper-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">song members</p>
              <h2 id="songsTitle">曲メンバー</h2>
            </div>
            <span class="save-note" id="songSaveNote"></span>
          </div>
          <p class="soft-text">参加する曲を押して切り替えます。</p>
          <div class="matrix-wrap">
            <div id="songMatrix" class="song-matrix"></div>
          </div>
        </div>
      </section>

      <section id="thursdays" class="view" aria-labelledby="thursdayTitle">
        <div class="paper-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">date list</p>
              <h2 id="thursdayTitle">日程一覧</h2>
            </div>
          </div>
          <section class="schedule-block">
            <select id="hotDateSelect" class="select"></select>
            <div id="selectedDateRanking" class="date-rankings"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div id="loading" class="loading is-active">
    <div class="loading-card">
      <div class="loader-line"></div>
      <p>読み込み中...</p>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./firebase-config.js"></script>
  <script type="module" src="./app.js?v=20260730-rare-once"></script>
</body>
</html>
